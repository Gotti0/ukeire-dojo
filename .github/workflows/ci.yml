name: CI and production delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Python and Java tests
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare Epsilon for CPU and scripted tests
        run: ./scripts/prepare-ci-engine.ps1
      - name: Run Java match tests
        run: ./tools/live-match/run-tests.ps1
      - name: Run Python tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install pytest==8.4.2
          python -m pytest -m "not gpu"

  web:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node --test
      - run: npm run build
      - name: Stamp build revision
        run: printf '%s\n' "$GITHUB_SHA" > dist/build-revision.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish and verify production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, web]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    concurrency:
      group: production-delivery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: web-dist
          path: web/dist
      - name: Publish tested build and verify rollout
        run: bash scripts/production/publish.sh "$GITHUB_SHA" https://ukeire-dojo.me
